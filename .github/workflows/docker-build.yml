name: docker

# Builds the evaluation image, checks that the tree compiles and passes
# self_test inside it, and publishes it to ghcr.io/<owner>/<repo> from main.
# The test builds in the container on the runner, so -march=native is safe.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      # load, not push: the image is tested before anything is published.
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and run self_test in the image
        run: |
          tag=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp "$tag" bash -c \
            'cmake -S . -B build && cmake --build build --target self_test -j "$(nproc)" && ./build/self_test'

      - name: Push
        if: github.event_name != 'pull_request'
        run: docker push --all-tags ghcr.io/${{ github.repository }}
